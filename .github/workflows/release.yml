name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build archives
        run: make archives

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/open-ports_*.tar.gz
            dist/open-ports_*.zip
            dist/SHA256SUMS.txt
